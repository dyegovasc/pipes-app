name: Framework integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/framework-integrity.yml'
      - '.pipes.example/**'
      - 'framework-releases/**'
      - 'frameworks/**'
      - 'scripts/**'
      - 'package.json'
      - '.nvmrc'
  push:
    paths:
      - '.github/workflows/framework-integrity.yml'
      - '.pipes.example/**'
      - 'framework-releases/**'
      - 'frameworks/**'
      - 'scripts/**'
      - 'package.json'
      - '.nvmrc'

permissions:
  contents: read

jobs:
  framework:
    name: Framework provenance, bundle, and script tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Check provenance, release assets, starter capabilities, and the bundle
        run: npm run check

      - name: Run the framework script tests
        run: npm run framework:test

      - name: Verify the starter kit
        run: node .pipes.example/utils/scripts/verify-starter.cjs --version "$(node -p "require('./.pipes.example/manifest.json').frameworkVersion")"
